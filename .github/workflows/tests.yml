# CI — اجرای خودکار سوئیت تست پروژهٔ آموزشگاه (تصمیم B2 سند checkpoints/2026-09-20-open-decisions.md)
#
# چرا: پیش از این هیچ CI نبود؛ یعنی «۵ failure وابسته به پوشهٔ اجرا» (که در Task 6 و سپس B1 فیکس شد)
# می‌توانست هفته‌ها بی‌سروصدا بماند و رگرسیون‌ها فقط وقتی دیده شوند که کسی دستی تست را اجرا کند.
#
# چه چیزی اجرا می‌شود (دو job مجزا — دلیل جدابودنشان در توضیح job دوم آمده):
#   ۱) کل سوئیت از **ریشهٔ ریپو** با **DB موقت** (sqlite در /tmp) — هیچ ارتباطی با DB واقعی آموزشگاه نیست.
#   ۲) یک سنجش مستقلِ «مستقل‌بودن از پوشهٔ اجرا» از داخل Kharazmi_Server/ (قفلِ فیکس B1).
#   ۳) گارد یکپارچگی: md5 فایل `Kharazmi_Server/gaj_db.db` قبل و بعد از تست‌ها باید یکی باشد
#      (قانون پروژه: DB واقعی هرگز در تست دست‌کاری نمی‌شود).
#   ۴) سوئیت route-audit (۲۵۲ تست route-level با seed قطعی و oracle محاسباتی) + همان گارد md5.
#
# توجه: تریگر عمداً فقط push است (بدون pull_request) — ساخت/بررسی/مرج PR فقط با دستور صریح کاربر.
# REFAC(P2c): پیش از این، نامِ شاخهٔ کاری هر نشست دستی به فهرست تریگرها اضافه می‌شد و
# شاخهٔ نشست‌های تمام‌شده هم آنجا می‌ماند (۵ مورد مرده). حالا یک الگو جای همه را می‌گیرد:
# هر شاخهٔ `arena/**` زیرِ هر دو job می‌رود، یعنی هر فازِ ریفکتور **پیش از مرج** سنجیده می‌شود.

name: tests

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (repo root + temp DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # DB موقت: هیچ تستی به دیتابیس واقعی آموزشگاه دست نمی‌زند
      DATABASE_URL: sqlite:////tmp/kharazmi_ci.db
      # راز صرفاً برای همین اجرا (تست‌ها به کلید واقعی نیاز ندارند)
      JWT_SECRET_KEY: ci-only-test-secret-not-production
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Kharazmi_Server/requirements.txt
            Kharazmi_Server/requirements-dev.txt

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt نسخه‌های ruff/mypy را pin کرده (۰٫۱۷٫۴ و ۲٫۴٫۱) و
          # pytest>=8.0 هم دارد، پس `pytest` آزادِ قبلی دیگر تکراری است. نصبِ اینها
          # فقط در jobِ خودِ گیت است: jobِ route-audit به ابزارهایِ lint نیاز ندارد.
          pip install -r Kharazmi_Server/requirements.txt -r Kharazmi_Server/requirements-dev.txt

      - name: Record real DB checksum (before)
        run: |
          echo "DB_BEFORE=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run full suite from repository root
        run: python -m pytest Kharazmi_Server/tests -q

      - name: Run suite from inside Kharazmi_Server (cwd-independence guard, B1)
        working-directory: Kharazmi_Server
        run: python -m pytest tests/test_audit.py tests/test_dashboard.py tests/test_dashboard_performance.py tests/test_suite_cwd_independence.py -q

      # گیتِ قراردادِ مسیرها: اندروید هرگز نباید مسیری را صدا بزند که سرور ندارد
      # (کلاسِ 404 در زمانِ اجرا) و `docs/app-map/server-routes.csv` نباید از سطحِ
      # واقعیِ OpenAPI عقب بماند. چرا `--gate` و نه خودِ اسکریپت: exit code پیش‌فرض
      # عمداً قرمز است چون CSVِ تاریخیِ فازِ صفر ۸ اعلامِ LiveApi/`auth/device_token`
      # را ندارد (ورودیِ منجمد؛ `--write` هم بازنویسی‌اش نمی‌کند) و اسکریپتی که همیشه
      # ۱ می‌دهد گیت نمی‌شود. `--gate` فقط ناورداهای زنده را اجبار می‌کند.
      # هزینه‌اش ~۲ ثانیه است: `live_server_routes()` اپ را با DB یک‌بارمصرف import
      # می‌کند و هرگز `Kharazmi_Server/gaj_db.db` را باز نمی‌کند — و چون پیش از گامِ
      # گاردِ md5 آمده، همان گارد این step را هم پوشش می‌دهد.
      - name: Gate the Android-server route contract
        run: python scripts/validate_app_map.py --gate

      # گیتِ کیفیتِ کدِ پایتون — همان الگویِ lint_gate.py و kotlin_warning_gate.py:
      # «بدتر نشود»، نه «صفر شود». ruff و mypy تا امروز نصب و اجرا می‌شدند ولی هیچ‌جا
      # گیت نمی‌شدند؛ یعنی عددِ ۲۵۰ خطایِ ruff و ۷۲۵ خطایِ mypy فقط در حافظهٔ دستیِ
      # توسعه‌دهنده‌ها زنده بود و یک commit می‌توانست بی‌صدا ده‌ها خطایِ تازه اضافه کند.
      # صفرکردنِ یکجایِ ۹۷۵ خطا ریفکتور نیست و بدونِ تستِ رفتار خطرِ ساختنِ باگِ واقعی دارد.
      # نسخهٔ ابزارها بخشی از baseline است و با pinِ requirements-dev.txt مقایسه می‌شود؛
      # اختلافِ نسخه ⇒ exit 2 یعنی «ناشناخته»، نه پاس و نه شکست. بهبود ⇒ exit 0 به‌همراهِ
      # JSONِ آمادهٔ commit در یک notice تا همان بهبود قفل شود (درسِ PR #27).
      - name: Gate Python code quality against the committed baseline
        run: python scripts/python_quality_gate.py --table --check

      - name: Guard - real institute database untouched
        run: |
          after=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)
          echo "checksum before: $DB_BEFORE"
          echo "checksum after : $after"
          if [ "$DB_BEFORE" != "$after" ]; then
            echo "::error::دیتابیس واقعی آموزشگاه در تست‌ها تغییر کرده است — این نقض قانون پروژه است."
            exit 1
          fi
          echo "✅ دیتابیس واقعی دست‌نخورده ماند."

  # سوئیت دوم — route audit (۲۵۲ تست route-level با seed قطعی و oracle محاسباتی).
  #
  # چرا job جدا و نه یک step بعدی در job بالا:
  #   دو سوئیت در **یک فرایند** همدیگر را خراب می‌کنند. models.py در اولین import
  #   engine/SessionLocal را از DATABASE_URL می‌سازد و آن ماژول در sys.modules کش می‌شود؛
  #   بعدتر conftestِ route_audit متغیر را به DB موقتِ خودش تغییر می‌دهد و seed روی همان
  #   engine قدیمی می‌نویسد ⇒ «UNIQUE constraint failed: branches.id» (اندازه‌گیری‌شده:
  #   1326 passed / 202 errors). مستند: checkpoints/2026-11-09-route-audit-clock-rot-fix.md
  #
  # چرا این سوئیت حالا در CI است: تا ۲۰۲۶-۱۱-۰۹ نه در testpaths بود و نه در CI؛ یعنی
  #   ۱۶۷ تستِ قرمزش (پوسیدگی زمانیِ seed) ماه‌ها دیده نمی‌شد.
  route-audit:
    name: route audit (tests/route_audit, separate process)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # conftestِ سوئیت، DATABASE_URL را خودش به DB موقتِ seed تبدیل می‌کند؛ این مقدار
      # صرفاً برای import اولیهٔ ماژول‌هاست و هرگز به دیتابیس واقعی نمی‌رسد.
      DATABASE_URL: sqlite:////tmp/kharazmi_route_audit.db
      JWT_SECRET_KEY: ci-only-test-secret-not-production
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Kharazmi_Server/requirements.txt

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r Kharazmi_Server/requirements.txt pytest

      - name: Record real DB checksum (before)
        run: |
          echo "DB_BEFORE=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run route-audit suite
        run: python -m pytest tests/route_audit -q

      - name: Guard - real institute database untouched
        run: |
          after=$(md5sum Kharazmi_Server/gaj_db.db | cut -d' ' -f1)
          echo "checksum before: $DB_BEFORE"
          echo "checksum after : $after"
          if [ "$DB_BEFORE" != "$after" ]; then
            echo "::error::دیتابیس واقعی آموزشگاه در تست‌های route audit تغییر کرده است — این نقض قانون پروژه است."
            exit 1
          fi
          echo "✅ دیتابیس واقعی دست‌نخورده ماند."
