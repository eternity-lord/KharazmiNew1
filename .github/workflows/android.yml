# CI — ساخت و تستِ واحدِ اپلیکیشن اندروید (`KharazmiAdmin/`)
#
# چرا این فایل اضافه شد (فاز P4):
#   تا ۲۰۲۶-۱۱-۰۹ هیچ workflow ای اپ اندروید را **هرگز** build نکرده بود؛ تنها CI ریپو
#   `tests.yml` است که pytest سمت سرور را می‌دواند. یعنی ۸۷ فایل Kotlin (۲۴٬۲۸۱ خط) بدونِ
#   هیچ گیتِ خودکاری تغییر می‌کردند و «آیا main امروز اصلاً کامپایل می‌شود؟» یک سؤالِ
#   **بی‌پاسخ** بود. بدونِ پاسخ به آن سؤال، ریفکتورِ رفتارمحافظ روی اپ معنایی ندارد —
#   چون در محیطِ کاریِ ما نه JVM هست، نه Gradle، نه دسترسی به Maven Central؛ پس هیچ تغییرِ
#   Kotlin را نمی‌توان محلی کامپایل یا تست کرد. این job همان گیتِ گم‌شده است.
#
# چه چیزی اجرا می‌شود:
#   ۱) `:app:assembleDebug`  — کامپایلِ Kotlin + **لینک شدنِ منابع** با AAPT2 + بسته‌بندی.
#      عمداً assemble و نه فقط compile: بخشِ بعدیِ P4 حذفِ منابعِ مرده است (۱۰۴ layout،
#      ۷۳ drawable، ۶ فایل values) و چیزی که «drawableِ حذف‌شده هنوز جایی ارجاع شده» را
#      می‌گیرد لینکِ منابع است، نه کامپایلرِ Kotlin.
#   ۲) `:app:testDebugUnitTest` — تست‌های واحدِ JVM (بدون امولاتور): `CachePolicy`،
#      `InputValidation`، `DebouncedRequest` با ساعتِ مجازیِ coroutines-test، و
#      `StudentProfileFormat` (گاردِ تاریخِ شمسی و قالبِ مبلغ).
#   ۳) `:app:lintDebug` + گیتِ baseline (فاز P4c) — تا این فاز lint هرگز اجرا نشده بود و
#      وضعیتش کاملاً ناشناخته بود. سیاست «صفرکن» نیست، «بدتر نشود» است: گزارشِ XML با
#      `KharazmiAdmin/lint-baseline.json` مقایسه می‌شود و **id جدید** یا **افزایشِ شمارِ هر id**
#      شکست است. کاهش مجاز است (و باید baseline را تازه کرد تا دستاورد قفل شود).
#      اگر `lint-baseline.json` در ریپو نباشد، گیت بی‌صدا رد نمی‌شود: یک `::warning::` صریح
#      می‌دهد که «هنوز enforcing نیست». جزئیات و محدودیتِ دانه‌بندی: `KharazmiAdmin/lint_gate.py`.
#
# چه چیزی عمداً اجرا **نمی‌شود**:
#   • `androidTest` (Espresso) — به امولاتور/دستگاه نیاز دارد؛ `AllActivitiesClickableTest.kt`
#     و `ExampleInstrumentedTest.kt` در این job دَویده نمی‌شوند.
#   • `assembleRelease` — minify خاموش است و امضای release در ریپو نیست.
#
# ─────────────────────────────────────────────────────────────────────────────
# بدهیِ wrapper حل شد (۲۰۲۶-۱۱-۱۲): سه‌گانهٔ رسمیِ Gradle 8.13.0 نصب شد
# ─────────────────────────────────────────────────────────────────────────────
#   تاریخچه: نخستین اجرای همین workflow با این پیام شکست خورد:
#       Error: At least one Gradle Wrapper Jar failed validation!
#       ✗ Found unknown Gradle Wrapper JAR files:
#         ccb27f2587513f0aac87b1587174aeaa167fe67643dea3fae4fce73d4d11594a
#   چون این فایل «یک blob باینری از کدِ اجراییِ commit‌شده در ریپو» است (دقیقاً همان چیزی
#   که حملهٔ زنجیرهٔ تأمین با PRِ «Update to Gradle xxx» انجام می‌شود)، کالبدشکافی شد:
#   کدِ داخلش همان Gradle 8.13 بود (۳۲ entry از ۳۳ با CRC-32 یکسان در برابرِ
#   `gradle/gradle@v8.13.0`) ولی ظرفِ ZIP یک بار باز و دوبسته شده بود (timestamp همهٔ
#   entryها ۲۰۲۶-۰۹-۱۰ در برابرِ ۱۹۸۰-۰۱-۰۱ِ رسمیِ reproducible) و MANIFEST یک
#   `Main-Class` اضافه داشت؛ همان که SHA-256 را عوض کرده بود.
#
#   تشخیصِ تکمیلیِ ۲۰۲۶-۱۱-۱۲ نشان داد انحراف فقط jar نبود — **wrapper سه‌جانبه ناسازگار
#   بود**:
#       • `gradle-wrapper.properties` → `gradle-8.13-bin.zip`
#       • `gradlew` / `gradlew.bat`   → قالبِ Gradle **۸٫۱۴+**: فراخوانیِ `-jar`،
#         `CLASSPATH="\"\""` (خالی)، بدونِ `-Dfile.encoding=UTF-8`، کپی‌رایتِ «2015» تنها
#       • `gradle-wrapper.jar`         → کلاس‌های ۸٫۱۳ با مانیفستِ `Main-Class`-دار
#         (که از ۸٫۱۴ رسمی است) در ظرفِ بازبسته‌بندی‌شده
#   سبکِ `-jar`+`Main-Class` از Gradle ۸٫۱۴ آمده (jarِ رسمیِ v8.14.0 = ۴۳۷۶۴ بایت با
#   `Main-Class`؛ jarِ رسمیِ v8.13.0 = ۴۳۷۰۵ بایت بدونِ آن). یعنی اسکریپت‌ها از نسخهٔ
#   جدیدتر، jar از نسخهٔ قدیمی‌تر و distributionUrl از سومی — پس `./gradlew` ریپو با jarِ
#   رسمیِ ۸٫۱۳ کار نمی‌کرد و برای همین CI تا امروز wrapper را اجرا نمی‌کرد.
#
#   راه‌حلِ خودِ Gradle اجرای `./gradlew wrapper` است که JVM و شبکه به services.gradle.org
#   می‌خواهد و در محیطِ کاریِ ما ممکن نیست. معادلِ آن بدونِ Gradle انجام شد: هر سه فایل
#   بایت‌به‌بایت از tag رسمیِ `v8.13.0` مخزنِ `gradle/gradle` از راهِ `api.github.com`
#   گرفته و نصب شدند:
#       gradle/wrapper/gradle-wrapper.jar   ۴۳۷۰۵ بایت  SHA-256 81a82aae…610fecd7ae45f
#       gradlew                              ۸۷۷۴ بایت  mode 100755، قالبِ GradleWrapperMain
#       gradlew.bat                          ۲۸۹۴ بایت
#   آن SHA-256 همان «Official Gradle 8.13 wrapper JAR checksum, verified against
#   services.gradle.org» است (مستقلاً هم در فهرست‌های allowlist عمومی دیده می‌شود)، پس
#   اعتبارسنجیِ رسمی دوباره فعال شد و build هم از wrapper اجرا می‌شود (`./gradlew`)، نه از
#   یک Gradleِ جداگانه با ورودیِ `gradle-version`. به این ترتیب نسخهٔ Gradleٔی که واقعاً
#   build می‌کند همان است که `gradle-wrapper.properties` اعلام می‌کند و توسعه‌دهندهٔ محلی هم
#   دقیقاً همان را می‌گیرد.
#
#   step «Guard» (pin دستیِ SHA-256 + مطابقتِ نسخهٔ CI با wrapper) پاک شد چون جانشینِ موقتِ
#   اعتبارسنجیِ رسمی بود؛ اکنون خودِ اکشن همان کار را با فهرستِ رسمیِ Gradle انجام می‌دهد و
#   برای هر انتشارِ آینده هم معتبر است نه فقط یک فایلِ پین‌شده.
#
#   اگر روزی wrapper بازتولید شد (`./gradlew wrapper`) هیچ کارِ اضافی لازم نیست: این job از
#   پیش در حالتِ استاندارد است. تنها قید این است که jarِ تازه هم از یک انتشارِ رسمیِ Gradle
#   باشد، وگرنه `validate-wrappers` می‌شکند — که دقیقاً خواستِ ماست.
#
# تریگر عمداً فقط push است (بدون pull_request) — هم‌راستا با `tests.yml`: ساخت/بررسی/مرجِ
# PR فقط با دستورِ صریح کاربر. هر شاخهٔ `arena/**` هم پوشش دارد تا هر فازِ P4 **پیش از
# مرج** سنجیده شود.

name: android

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    # تشخیصِ on-demand: baseline عمداً فقط **شمارِ** مسئله‌ها را دارد (باید در یک annotation
    # جا شود)، ولی برای رفعِ باگ به مکانِ `file:line` نیاز است و گزارشِ XML فقط این‌جا در CI
    # تولید می‌شود. با این ورودی‌ها می‌توان بدونِ دست‌زدن به workflow مکان‌ها را بیرون کشید:
    #   gh workflow run android --ref <branch> -f lint_ids=NewApi,ResourceType
    inputs:
      lint_ids:
        description: "فهرستِ شناسه‌های lint با کاما (مثلاً NewApi,ResourceType)؛ خالی = هیچ"
        required: false
        default: ""
        type: string
      lint_max_per_id:
        description: "سقفِ تعدادِ مکانِ چاپ‌شده برای هر شناسه"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android (assembleDebug + JVM unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: KharazmiAdmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.13.1 به JDK 17 یا بالاتر نیاز دارد؛ رانر چند JDK دارد، پس صریح پین می‌کنیم.
      - name: Set up JDK 17 (required by AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # اعتبارسنجیِ wrapper **فعال** است: jarِ ریپو بایت‌به‌بایت همان artifactِ رسمیِ
      # `gradle/gradle@v8.13.0` است (توضیح در سرِ همین فایل)، پس این گیت دیگر مانع نیست و
      # جایِ step «Guard» قدیمی را می‌گیرد. `gradle-version` عمداً ست **نشده**: build باید از
      # wrapper اجرا شود تا نسخهٔ Gradle همان باشد که `gradle-wrapper.properties` اعلام
      # می‌کند، نه نسخهٔ دلخواهِ CI.
      # کشِ وابستگی‌ها: build سردِ Gradle چند دقیقه است، با کش به حدود یک دقیقه می‌رسد.
      - name: Set up Gradle (version comes from the wrapper, dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `local.properties` عمداً در ریپو نیست (مسیرِ SDK ماشین‌به‌ماشین فرق می‌کند)، پس AGP
      # باید `sdk.dir` را از SDKِ از‌پیش‌نصب‌شدهٔ رانر بخواند. اگر رانر روزی بدون
      # ANDROID_HOME باشد، این step با پیامِ روشن شکست می‌خورد به‌جای اینکه AGP خطای
      # گمراه‌کننده بدهد.
      - name: Point the build at the runner's Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME روی رانر ست نیست — SDK اندروید پیدا نشد."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SDK:    $ANDROID_HOME"
          java -version 2>&1 | head -1
          ./gradlew --version | sed -n '1,12p'

      # compileSdk = 34 است؛ تصویرِ رانر ممکن است platform دیگری داشته باشد. پذیرشِ license
      # هم این‌جا انجام می‌شود تا AGP بتواند هر جزءِ دیگری را که لازم دارد خودش دانلود کند.
      - name: Ensure the required Android SDK packages are present
        run: |
          set -euo pipefail
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkm" ]; then
            sdkm="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$sdkm" ]; then
            echo "::error::sdkmanager پیدا نشد."
            exit 1
          fi
          yes | "$sdkm" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "platforms;android-34 نصب نیست — نصب می‌شود…"
            "$sdkm" "platforms;android-34"
          fi
          ls "$ANDROID_HOME/platforms" | sed 's/^/  platform: /'
          echo "✅ SDK موردنیاز حاضر است."

      # خروجیِ Gradle هم‌زمان در فایل ثبت می‌شود تا step «Report» بتواند خلاصهٔ خطا را
      # منتشر کند. `pipefail` لازم است وگرنه `tee` کدِ خروجِ Gradle را می‌پوشاند.
      - name: Compile Kotlin and link resources (debug variant)
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:assembleDebug 2>&1 | tee /tmp/gradle-assemble.log

      # ── فاز P4d-7: موجودیِ warningهای کامپایلرِ Kotlin ───────────────────────
      # تا امروز خروجیِ کامپایلر خوانده نمی‌شد و شمارِ warningها **ناشناخته** بود، درحالی‌که
      # `allWarningsAsErrors` هم ست نشده. warningهای کامپایلر با lint فرق دارند: می‌توانند
      # باگِ واقعی باشند (`Name shadowed`، `Casting will throw ClassCastException`،
      # `Unreachable code`)، نه فقط سبک.
      # این گام فعلاً **گزارش‌دهی** است نه enforcing — به همان دلیلی که فازِ P4c برای lint
      # این‌گونه شروع شد: baseline باید از CI بیاید، چون artifact قابلِ دانلود نیست و
      # `output.summary` از API خالی برمی‌گردد؛ تنها کانالِ قابلِ اتکا annotation است. پس
      # `--emit-baseline` خودِ JSON را در annotationِ قطعه‌بندی‌شده چاپ می‌کند تا commit شود
      # و گامِ بعدی با `--check` enforcing شود («بدتر نشود»، نه «صفر شود»).
      # fail-closed: اگر لاگِ کامپایل نباشد/خالی باشد یا `BUILD FAILED` داشته باشد، اسکریپت
      # exit=2 می‌دهد؛ یک لاگِ ناقص هرگز «صفر warning» گزارش نمی‌شود.
      - name: Report the Kotlin compiler warning inventory
        run: |
          python3 kotlin_warning_gate.py --log /tmp/gradle-assemble.log --table \
            --emit-baseline --source "CI run ${GITHUB_RUN_ID}"

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:testDebugUnitTest 2>&1 | tee /tmp/gradle-test.log

      # ── فاز P4c: گیتِ lint («بدتر نشود») ──────────────────────────────────────
      # `abortOnError = false` در `app/build.gradle.kts` ست شده تا این task حتی با وجودِ
      # مسئله هم گزارشِ XML را بنویسد و نشکند؛ تصمیمِ رد/قبول با step بعدی است که گزارش را
      # با `KharazmiAdmin/lint-baseline.json` مقایسه می‌کند.
      - name: Run Android lint (debug variant)
        run: |
          set -o pipefail
          ./gradlew --stacktrace :app:lintDebug 2>&1 | tee /tmp/gradle-lint.log

      # چرا جدولِ فشرده به‌صورتِ annotation منتشر می‌شود: لاگِ خامِ job از هاستِ
      # `results-receiver...` سرو می‌شود و دانلودِ artifact از `pipelines...` — که هر دو در
      # محیطِ کاریِ ما بسته‌اند. `output.summary` هم از API خالی برمی‌گردد. تنها کانالِ خوانا
      # از `api.github.com` **annotation** است، و GitHub برای هر اجرا تعدادِ کمی annotation
      # نگه می‌دارد، پس یک پیامِ چندخطی و فشرده فرستاده می‌شود نه یکی به ازای هر مسئله.
      - name: Gate lint against the committed baseline
        run: |
          set -uo pipefail
          report=$(find app/build/reports -name 'lint-results*.xml' -type f 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "::error title=lint gate could not run::گزارشِ XML لینت پیدا نشد؛ یعنی :app:lintDebug اجرا نشده یا شکسته است. نبودنِ گزارش هرگز «صفر مسئله» تلقی نمی‌شود."
            tail -n 25 /tmp/gradle-lint.log 2>/dev/null || true
            exit 2
          fi
          echo "report: $report"
          # جدولِ کامل همیشه منتشر می‌شود (حتی وقتی گیت رد می‌شود) تا علتِ شکست خوانا باشد
          python3 lint_gate.py --report "$report" --table
          if [ ! -f lint-baseline.json ]; then
            echo "::warning title=lint gate is NOT enforcing yet::فایلِ KharazmiAdmin/lint-baseline.json در ریپو نیست، پس «بدتر نشود» تعریف ندارد و این گیت فقط گزارش می‌دهد. این حالت باید موقت باشد: جدولِ annotationِ همین اجرا را در آن فایل commit کنید."
            exit 0
          fi
          python3 lint_gate.py --report "$report" --baseline lint-baseline.json --check

      # ── مکانِ دقیقِ مسئله‌ها ──────────────────────────────────────────────────
      # baseline عمداً فقط **شمارِ** مسئله‌ها را دارد (باید در یک annotation جا شود)، ولی
      # برای رفعِ باگ به `file:line` نیاز است و گزارشِ XML فقط روی رانر وجود دارد. پس این
      # step مکان‌ها را از همان کانالِ annotation بیرون می‌دهد.
      #
      # منبعِ درخواست، به این ترتیب:
      #   ۱) ورودیِ `lint_ids` در workflow_dispatch (اگر کسی حقِ `actions:write` داشته باشد؛
      #      توکنِ فعلیِ این محیط ۴۰۳ می‌گیرد، پس این مسیر امروز در دسترس نیست)
      #   ۲) فایلِ commit‌شدهٔ `KharazmiAdmin/lint-locations-request.txt` — خطِ اول شناسه‌ها
      #      با کاما، خطِ دوم سقفِ تعداد برای هر شناسه. این مسیر روی **push** هم کار می‌کند
      #      و یعنی برای هر تشخیصِ جدید لازم نیست workflow را عوض کرد و بعد برگرداند.
      #   ۳) هیچ‌کدام ⇒ step بی‌صدا رد می‌شود. عمداً `--ids ""` زده **نمی‌شود**، چون
      #      «لیستِ خالی» در ابزار یعنی «همهٔ شناسه‌ها» و آن یعنی ۱۳۸۵ مکان در هر اجرا.
      #      (در رویدادِ push مقدارِ `inputs` هم null است و `null != ''` در عبارت‌های
      #      GitHub **true** می‌شود، پس شرط‌گذاری روی خودِ ورودی هم کافی نبود.)
      # ورودی‌ها از env پاس می‌شوند نه درون‌خطی در shell، تا تزریقِ دستور ممکن نباشد.
      - name: Publish lint locations for the requested ids
        env:
          LINT_IDS: ${{ inputs.lint_ids }}
          LINT_MAX: ${{ inputs.lint_max_per_id }}
          REQ_FILE: lint-locations-request.txt
        run: |
          set -uo pipefail
          ids="${LINT_IDS:-}"
          max="${LINT_MAX:-}"
          # مقدارِ پیش‌فرض عمداً این‌جا هم هست: با `set -u` اگر `env:` این متغیر را نرساند
          # step بی‌دلیل می‌میرد، و اسکریپتِ step نباید به سیم‌کشیِ env وابسته باشد.
          req="${REQ_FILE:-lint-locations-request.txt}"
          if [ -z "$ids" ] && [ -s "$req" ]; then
            ids=$(sed -n 1p "$req" | tr -d '\r' | tr -d ' ')
            max=$(sed -n 2p "$req" | tr -d '\r' | tr -d ' ')
          fi
          if [ -z "$ids" ]; then
            echo "no lint-location request (neither input nor $req) - skipping"
            exit 0
          fi
          report=$(find app/build/reports -name 'lint-results*.xml' -type f 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "::error title=lint locations could not run::گزارشِ XML لینت پیدا نشد."
            exit 2
          fi
          echo "requesting locations for: $ids (max per id: ${max:-20})"
          python3 lint_gate.py --report "$report" --locations --ids "$ids" --max-per-id "${max:-20}"

      # ── چرا این step وجود دارد ────────────────────────────────────────────────
      # لاگِ خامِ job از هاستِ `results-receiver.actions.githubusercontent.com` سرو می‌شود
      # که در هر محیطی در دسترس نیست (مثلاً در محیطِ کاریِ این فاز کاملاً بسته است)، ولی
      # **annotationها** از `api.github.com` خواندنی‌اند. پس خلاصهٔ شکست به‌صورتِ یک
      # annotationِ چندخطی منتشر می‌شود تا علتِ خطا بدونِ بازکردنِ وب‌UI قابلِ خواندن باشد.
      # این یک ترفندِ موقت نیست: برای هر اجرای ناموفقِ آینده هم همین کار را می‌کند.
      - name: Report the failure inline as an annotation
        if: failure()
        run: |
          set -uo pipefail
          log=$(ls -t /tmp/gradle-*.log 2>/dev/null | head -1 || true)
          if [ -z "$log" ]; then
            echo "هیچ لاگِ Gradle ثبت نشده — شکست پیش از اجرای build بوده است."
            exit 0
          fi
          {
            echo "GRADLE FAILURE (from $(basename "$log"))"
            grep -E "^e: |^w: |error:|FAILURE:|What went wrong|^> Task .* FAILED|Execution failed for task|Caused by:|A problem occurred|Could not resolve|Could not find|Unresolved reference|is not abstract|overrides nothing" "$log" | head -45
            echo "----- last 25 lines -----"
            tail -n 25 "$log"
          } > /tmp/failure_summary.txt
          # در workflow command باید `%` و newline فرار شوند
          msg=$(sed -e 's/%/%25/g' -e 's/$/%0A/' /tmp/failure_summary.txt | tr -d '\n')
          echo "::error title=Gradle build failed::${msg}"
          {
            echo "### Gradle failure summary"
            echo '```'
            cat /tmp/failure_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # اگر چیزی شکست، گزارش‌ها را نگه دار تا بدونِ اجرای دوباره بتوان تشخیص داد چه شد
      # (خروجیِ Gradle در لاگ همهٔ جزئیاتِ تست را نمی‌آورد).
      - name: Upload build and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_id }}
          path: |
            KharazmiAdmin/app/build/reports/
            KharazmiAdmin/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
